[platformio]
src_dir = firmware
default_envs = deskburn

[env]
; 6.3.0 使用与出厂固件一致的 Arduino ESP32 2.0.9 / ESP-IDF 4.4.5。
platform = espressif32@6.3.0
board = airm2m_core_esp32c3
framework = arduino

; 出厂固件使用 4MB Flash；测试程序不擦除整片 Flash，便于保留恢复空间。
board_build.f_cpu = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB

monitor_speed = 115200

; 通过原生 USB 输出启动日志，便于确认程序是否进入 setup()。
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

; 引脚与控制器扫描固件。自带最小 SPI 驱动，不依赖 TFT_eSPI，
; 因此可以在一次烧录里运行时切换 SCLK 引脚和初始化序列。
[env:pin_scanner]
build_src_filter = +<pin_scanner/>

; 正式仪表盘固件。引脚与分辨率由 pin_scanner 实测确认。
[env:deskburn]
build_src_filter = +<deskburn/>

lib_deps =
    ; DuduClock 的 User_Setup.h 来自该版本模板，保持驱动实现完全一致。
    bodmer/TFT_eSPI@2.5.0
    ; 比 Arduino 自带的 Bluedroid 少占约 100KB RAM 和大量 flash。
    ; 锁在 1.4.x：NimBLE 2.x 要求 Arduino core 3.x，而本项目为对齐出厂固件
    ; 固定在 2.0.9。
    h2zero/NimBLE-Arduino@^1.4.1

; link_ble.h 使用 C++17 inline 变量共享 BLE 状态。显式切换标准，避免默认
; GNU++11 仅以编译器扩展接受该语法，在更严格的工具链上直接失败。
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -D USER_SETUP_LOADED=1
    ; 实测通用 ST7789 初始化序列可驱动本面板，与卖家标注一致。
    -D ST7789_DRIVER=1
    ; 面板原生 240x320，setRotation(1) 后为 320x240 横屏；
    ; 此前按 480x320 排障是被 3.5 寸的外观尺寸误导了。
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; SCLK 是 GPIO2 而不是 GPIO10：GPIO10 是板载默认 SPI 的 MISO，
    ; 此前所有 480x320 测试都把它当成时钟，所以只有背光没有画面。
    -D TFT_SCLK=2
    -D TFT_MOSI=3
    -D TFT_CS=7
    -D TFT_DC=4
    -D TFT_RST=5
    ; 面板实测为 BGR：按 RGB 送色时 Claude 图标的品牌橙会显示成蓝色。
    ; 其余用色都是 R/B 对称的灰阶，所以此前一直没暴露出来。
    -D TFT_RGB_ORDER=TFT_BGR
    ; 扫描固件里的初始化序列带 INVON，这里保持一致。
    -D TFT_INVERSION_ON=1
    ; 沿用扫描阶段验证过的保守频率；局部重绘的数据量很小，不需要更快。
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT4=1
    ; 今日金额改用 assets.h 里烘焙的 SF Pro Bold 字形，不再需要内置 Font 6。

; 瑞士平面海报展示版本。继承相同的主控、屏幕、BLE 依赖和实测引脚，只替换
; 编译入口与页面资源，因此 Mac 采集端、协议和烧录方法都与经典版一致。
[env:deskburn_swiss]
extends = env:deskburn
build_src_filter = +<deskburn_swiss/>

; Midnight Buddy 深色可爱展示版本。与前两版共享硬件、BLE 和 NVS，只新增独立
; 页面入口与烘焙资源；非对称左右分屏不会影响 Mac 采集端的数据契约。
[env:deskburn_buddy]
extends = env:deskburn
build_src_filter = +<deskburn_buddy/>

; Cosmic Buddy 月夜精灵展示版本。完整 RGB565 美术背景和动态文字分层渲染；
; 字段更新时从背景资源恢复纹理，不改变共享 BLE、NVS 或数据契约。
[env:deskburn_cosmic]
extends = env:deskburn
build_src_filter = +<deskburn_cosmic/>
